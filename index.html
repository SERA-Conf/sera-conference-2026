<script>

const CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vRMrcoDNYRb8VfAG9dTTEGRWtLRLDPkAumjl-ePZ7PHp6xl4SAI9K4GVX-3FyTu5_YCddZl8jxWbagu/pub?gid=0&single=true&output=csv";

let allSessions = [];
let selectedDay = "Wednesday";
let showFavouritesOnly = false;
let currentModalSession = null;

const $ = selector => document.querySelector(selector);


/* -------------------------------------------------------
   Utility functions
------------------------------------------------------- */

function clean(value){
  if(value === null || value === undefined) return "";
  return String(value).trim();
}

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function minutes(time){

  if(!time) return 0;

  const match = String(time).trim().match(
    /^(\d{1,2})(?::(\d{2}))?\s*(am|pm)?$/i
  );

  if(!match) return 0;

  let hour = parseInt(match[1],10);
  let minute = parseInt(match[2] || "0",10);
  const ampm = match[3];

  if(ampm){
    const lower = ampm.toLowerCase();

    if(lower === "pm" && hour !== 12){
      hour += 12;
    }

    if(lower === "am" && hour === 12){
      hour = 0;
    }
  }

  return hour * 60 + minute;
}

function minutesToTime(total){

  let hour = Math.floor(total / 60);
  const minute = total % 60;

  const suffix = hour >= 12 ? "pm" : "am";

  if(hour > 12){
    hour -= 12;
  }

  if(hour === 0){
    hour = 12;
  }

  return `${hour}:${String(minute).padStart(2,"0")} ${suffix}`;
}

function normaliseRoom(room){
  return clean(room);
}


/* -------------------------------------------------------
   CSV parser
------------------------------------------------------- */

function parseCSV(text){

  const rows = [];
  let row = [];
  let cell = "";
  let inQuotes = false;

  for(let i=0;i<text.length;i++){

    const char = text[i];
    const next = text[i+1];

    if(char === '"' && inQuotes && next === '"'){
      cell += '"';
      i++;
      continue;
    }

    if(char === '"'){
      inQuotes = !inQuotes;
      continue;
    }

    if(char === "," && !inQuotes){
      row.push(cell);
      cell = "";
      continue;
    }

    if((char === "\n" || char === "\r") && !inQuotes){

      if(char === "\r" && next === "\n"){
        i++;
      }

      row.push(cell);
      cell = "";

      if(row.some(value => clean(value) !== "")){
        rows.push(row);
      }

      row = [];
      continue;
    }

    cell += char;
  }

  if(cell !== "" || row.length){
    row.push(cell);

    if(row.some(value => clean(value) !== "")){
      rows.push(row);
    }
  }

  return rows;
}


/* -------------------------------------------------------
   Convert Google Sheet rows into sessions
------------------------------------------------------- */

function convertRows(rows){

  if(!rows.length) return [];

  const headers = rows[0].map(
    header => clean(header).toLowerCase()
  );

  function indexOfHeader(name){
    return headers.indexOf(name);
  }

  const columns = {

    id: indexOfHeader("id"),
    day: indexOfHeader("day"),
    date: indexOfHeader("date"),
    start: indexOfHeader("start"),
    end: indexOfHeader("end"),
    room: indexOfHeader("room"),
    type: indexOfHeader("type"),
    title: indexOfHeader("title"),
    speaker: indexOfHeader("speaker(s)"),
    affiliation: indexOfHeader("affiliation"),
    strand: indexOfHeader("strand"),
    chair: indexOfHeader("chair"),

    // NEW COLUMN
    abstract: indexOfHeader("abstract")
  };

  return rows.slice(1).map((row,index) => {

    const value = column => {

      if(column === -1) return "";

      return clean(row[column]);

    };

    return {

      id: value(columns.id) || `session-${index + 1}`,

      day: value(columns.day),

      date: value(columns.date),

      start: value(columns.start),

      end: value(columns.end),

      room: normaliseRoom(value(columns.room)),

      type: value(columns.type),

      title: value(columns.title),

      speaker: value(columns.speaker),

      affiliation: value(columns.affiliation),

      strand: value(columns.strand),

      chair: value(columns.chair),

      // NEW: ABSTRACT FROM GOOGLE SHEET
      abstract: value(columns.abstract)

    };

  }).filter(session => {

    return (
      session.title ||
      session.room ||
      session.type ||
      session.start
    );

  });

}


/* -------------------------------------------------------
   Load programme
------------------------------------------------------- */

async function loadProgramme(){

  const status = $("#status");

  status.textContent = "Loading programme…";
  status.classList.remove("error");

  try{

    const response = await fetch(
      CSV_URL + "&cache=" + Date.now()
    );

    if(!response.ok){
      throw new Error("Could not load the programme.");
    }

    const csv = await response.text();

    const rows = parseCSV(csv);

    allSessions = convertRows(rows);

    status.textContent =
      `${allSessions.length} programme items loaded.`;

    render();

  }catch(error){

    console.error(error);

    status.textContent =
      "Unable to load the programme. Please try again later.";

    status.classList.add("error");

    $("#programme").innerHTML = `
      <div class="empty">
        The programme could not be loaded.
      </div>
    `;

  }

}


/* -------------------------------------------------------
   Day handling
------------------------------------------------------- */

function sessionBelongsToSelectedDay(session){

  const day = clean(session.day).toLowerCase();

  if(day){
    return day === selectedDay.toLowerCase();
  }

  const date = clean(session.date).toLowerCase();

  if(selectedDay === "Wednesday"){
    return (
      date.includes("18th") ||
      date.includes("18/")
    );
  }

  return (
    date.includes("19th") ||
    date.includes("19/")
  );

}

function getDaySessions(){

  return allSessions.filter(
    session => sessionBelongsToSelectedDay(session)
  );

}

function getFilteredSessions(){

  let sessions = getDaySessions();

  const search = clean($("#search").value).toLowerCase();

  if(search){

    sessions = sessions.filter(session => {

      const searchable = [
        session.title,
        session.speaker,
        session.affiliation,
        session.type,
        session.strand,
        session.chair,
        session.room,
        session.abstract
      ]
      .join(" ")
      .toLowerCase();

      return searchable.includes(search);

    });

  }

  if(showFavouritesOnly){

    const favourites =
      JSON.parse(localStorage.getItem("sera-favourites") || "[]");

    sessions = sessions.filter(
      session => favourites.includes(session.id)
    );

  }

  return sessions;

}


/* -------------------------------------------------------
   Rooms
------------------------------------------------------- */

function isAllRooms(session){

  return clean(session.room).toLowerCase() === "all rooms";

}

function getRooms(sessions){

  const rooms = [];

  sessions.forEach(session => {

    if(isAllRooms(session)) return;

    if(session.room && !rooms.includes(session.room)){
      rooms.push(session.room);
    }

  });

  return rooms;

}


/* -------------------------------------------------------
   Favourites
------------------------------------------------------- */

function getFavourites(){

  return JSON.parse(
    localStorage.getItem("sera-favourites") || "[]"
  );

}

function isFavourite(id){

  return getFavourites().includes(id);

}

function toggleFavourite(id){

  let favourites = getFavourites();

  if(favourites.includes(id)){

    favourites =
      favourites.filter(item => item !== id);

  }else{

    favourites.push(id);

  }

  localStorage.setItem(
    "sera-favourites",
    JSON.stringify(favourites)
  );

  render();

  if(
    currentModalSession &&
    currentModalSession.id === id
  ){

    updateModalFavourite();

  }

}


/* -------------------------------------------------------
   Session card
------------------------------------------------------- */

function makeSessionCard(session){

  const favourite =
    isFavourite(session.id);

  return `

    <div
      class="session-card ${favourite ? "favourite" : ""}"
      data-id="${escapeHTML(session.id)}"
    >

      <div class="session-title">
        ${escapeHTML(session.title || "Untitled session")}
      </div>

      ${
        session.speaker
        ?
        `<div class="session-speaker">
          ${escapeHTML(session.speaker)}
        </div>`
        :
        ""
      }

      ${
        session.affiliation
        ?
        `<div class="session-affiliation">
          ${escapeHTML(session.affiliation)}
        </div>`
        :
        ""
      }

      <div class="session-meta">

        ${
          session.type
          ?
          `<span class="badge">
            ${escapeHTML(session.type)}
          </span>`
          :
          ""
        }

        ${
          session.strand
          ?
          `<span class="badge">
            ${escapeHTML(session.strand)}
          </span>`
          :
          ""
        }

      </div>

      ${
        session.chair
        ?
        `<div class="chair">
          Chair: ${escapeHTML(session.chair)}
        </div>`
        :
        ""
      }

    </div>

  `;

}


/* -------------------------------------------------------
   All Rooms block
------------------------------------------------------- */

function makeAllRoomsBlock(session){

  const favourite =

  return `

    <div
      class="all-rooms-block ${favourite ? "favourite" : ""}"
      data-id="${escapeHTML(session.id)}"
    >

      <div class="session-title">
        ${escapeHTML(session.title || "Untitled session")}
      </div>

      ${
        session.speaker
        ?
        `<div class="session-speaker">
          ${escapeHTML(session.speaker)}
        </div>`
        :
        ""
      }

      ${
        session.affiliation
        ?
        `<div class="session-affiliation">
          ${escapeHTML(session.affiliation)}
        </div>`
        :
        ""
      }

      <div class="session-meta">

        ${
          session.type
          ?
          `<span class="badge">
            ${escapeHTML(session.type)}
          </span>`
          :
          ""
        }

      </div>

      ${
        session.chair
        ?
        `<div class="chair">
          Chair: ${escapeHTML(session.chair)}
        </div>`
        :
        ""
      }

    </div>

  `;

}


/* -------------------------------------------------------
   Render
------------------------------------------------------- */

function render(){

  const programme = $("#programme");

  const sessions = getFilteredSessions();

  $("#dayTitle").textContent =
    selectedDay === "Wednesday"
      ? "Wednesday 18 November"
      : "Thursday 19 November";

  $("#dayDate").textContent =
    selectedDay === "Wednesday"
      ? "Edinburgh Napier University"
      : "Edinburgh Napier University";

  if(!sessions.length){

    programme.innerHTML = `
      <div class="empty">
        No programme items match your search.
      </div>
    `;

    placeNow();

    return;

  }

  const allRoomsSessions =
    sessions.filter(isAllRooms);

  const roomSessions =
    sessions.filter(session => !isAllRooms(session));

  let html = "";

  /* All Rooms */

  if(allRoomsSessions.length){

    html += `
      <div class="all-rooms-section">
        <div class="room-section">

          <div class="room-title">
            All Rooms
          </div>

          <div class="session-area">
    `;

    allRoomsSessions
      .sort((a,b) => minutes(a.start) - minutes(b.start))
      .forEach(session => {

        html += `
          <div class="session-row">

            <div class="session-time">
              ${escapeHTML(session.start)}
              ${
                session.end
                ? `<br>–<br>${escapeHTML(session.end)}`
                : ""
              }
            </div>

            <div class="session-area">
              ${makeAllRoomsBlock(session)}
            </div>

          </div>
        `;

      });

    html += `
          </div>
        </div>
      </div>
    `;

  }

  /* Individual rooms */

  const rooms = getRooms(roomSessions);

  rooms.forEach(room => {

    const sessionsInRoom =
      roomSessions
        .filter(session => session.room === room)
        .sort((a,b) => minutes(a.start) - minutes(b.start));

    html += `

      <section class="room-section">

        <div class="room-title">
          ${escapeHTML(room)}
        </div>

        <div class="timeline-scroll">

          <div class="timeline">

    `;

    sessionsInRoom.forEach(session => {

      html += `

        <div class="session-row">

          <div class="session-time">

            ${escapeHTML(session.start)}

            ${
              session.end
              ?
              `<br>–<br>${escapeHTML(session.end)}`
              :
              ""
            }

          </div>

          <div class="session-area">

            ${makeSessionCard(session)}

          </div>

        </div>

      `;

    });

    html += `

          </div>

        </div>

      </section>

    `;

  });

  programme.innerHTML = html;

  attachSessionHandlers();

  placeNow();

}


/* -------------------------------------------------------
   Session click handlers
------------------------------------------------------- */

function attachSessionHandlers(){

  document
    .querySelectorAll("[data-id]")
    .forEach(element => {

      element.addEventListener("click", event => {

        const id =
          element.getAttribute("data-id");

        const session =
          allSessions.find(item => item.id === id);

        if(!session) return;

        openModal(session);

      });

    });

}


/* -------------------------------------------------------
   Modal
------------------------------------------------------- */

function openModal(session){

  currentModalSession = session;

  $("#modalTitle").textContent =
    session.title || "Untitled session";

  $("#modalType").textContent =
    session.type || "—";

  $("#modalTime").textContent =
    session.start
      ?
      `${session.start}${session.end ? " – " + session.end : ""}`
      :
      "—";

  $("#modalSpeaker").textContent =
    session.speaker || "—";

  $("#modalAffiliation").textContent =
    session.affiliation || "—";

  $("#modalRoom").textContent =
    session.room || "—";

  $("#modalStrand").textContent =
    session.strand || "—";

  $("#modalChair").textContent =
    session.chair || "—";


  /* -----------------------------------------
     NEW: DISPLAY ABSTRACT
  ----------------------------------------- */

  if(session.abstract){

    $("#modalAbstract").textContent =
      session.abstract;

    $("#modalAbstract").classList.remove(
      "no-abstract"
    );

  }else{

    $("#modalAbstract").textContent =
      "No abstract available.";

    $("#modalAbstract").classList.add(
      "no-abstract"
    );

  }


  updateModalFavourite();

  $("#modal").classList.add("open");

  $("#modal").setAttribute(
    "aria-hidden",
    "false"
  );

  document.body.style.overflow = "hidden";

}


function closeModal(){

  $("#modal").classList.remove("open");

  $("#modal").setAttribute(
    "aria-hidden",
    "true"
  );

  document.body.style.overflow = "";

  currentModalSession = null;

}

function updateModalFavourite(){

  if(!currentModalSession) return;

  const button =
    $("#modalFavourite");

  const favourite =
    isFavourite(currentModalSession.id);

  button.textContent =
    favourite
      ? "★ Remove from favourites"
      : "☆ Add to favourites";

  button.classList.toggle(
    "active",
    favourite
  );

}


/* -------------------------------------------------------
   Happening now
------------------------------------------------------- */

function placeNow(){

  const nowLine = $("#nowLine");

  if(!allSessions.length){

    nowLine.textContent = "";

    return;

  }

  const now = new Date();

  const currentHour =
    now.getHours();

  const currentMinute =
    now.getMinutes();

  const currentTotal =
    currentHour * 60 + currentMinute;

  const currentSessions =
    getDaySessions().filter(session => {

      const start =
        minutes(session.start);

      const end =
        minutes(session.end);

      return (
        currentTotal >= start &&
        currentTotal < end
      );

    });

  if(currentSessions.length){

    nowLine.textContent =
      "● HAPPENING NOW: " +
      currentSessions
        .map(session => session.title)
        .join(" · ");

  }else{

    nowLine.textContent = "";

  }

}


/* -------------------------------------------------------
   Event listeners
------------------------------------------------------- */

document
  .querySelectorAll(".day-button")
  .forEach(button => {

    button.addEventListener("click", () => {

      document
        .querySelectorAll(".day-button")
        .forEach(item =>
          item.classList.remove("active")
        );

      button.classList.add("active");

      selectedDay =
        button.getAttribute("data-day");

      render();

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

    });

  });


$("#search").addEventListener(
  "input",
  render
);


$("#favouritesButton").addEventListener(
  "click",
  () => {

    showFavouritesOnly =
      !showFavouritesOnly;

    $("#favouritesButton")
      .classList.toggle(
        "active",
        showFavouritesOnly
      );

    render();

  }
);


$("#closeModal").addEventListener(
  "click",
  closeModal
);


$("#modalFavourite").addEventListener(
  "click",
  () => {

    if(currentModalSession){

      toggleFavourite(
        currentModalSession.id
      );

    }

  }
);


$("#modal").addEventListener(
  "click",
  event => {

    if(event.target === $("#modal")){

      closeModal();

    }

  }
);


document.addEventListener(
  "keydown",
  event => {

    if(event.key === "Escape"){

      closeModal();

    }

  }
);


/* -------------------------------------------------------
   Start
------------------------------------------------------- */

loadProgramme();

setInterval(
  placeNow,
  60000
);

</script>

</html>
